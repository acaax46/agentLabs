openapi: 3.0.3
info:
  title: AgentLab local development API
  version: 0.1.0
  description: AgentLab 本地账号、资料管理、任务发布、工作区与持久调度 API；运行能力由实际接入的执行器声明。
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/v1/connections:
    get:
      operationId: listConnections
      description: 仅返回本机构共享连接和当前用户个人连接的元信息，不返回密钥。
      responses:
        '200':
          description: 可见连接列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
    post:
      operationId: createConnection
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: header
          name: X-AgentLab-Request
          required: true
          schema:
            type: string
            enum: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
      responses:
        '200': &connectionResponse
          description: 连接元信息。active 仅表示鉴权和所选模型列表通过验证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /api/v1/connections/{id}/verify:
    parameters: &connectionPath
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-AgentLab-Request
        required: true
        schema:
          type: string
          enum: [connections]
    post:
      operationId: verifyConnection
      description: 通过固定模型列表端点验证授权，不发送项目内容，不发起付费推理。
      requestBody: &connectionMutation
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionMutation'
      responses:
        '200': *connectionResponse
  /api/v1/connections/{id}/rotate:
    parameters: *connectionPath
    post:
      operationId: rotateConnectionKey
      description: 更换密钥并增加连接代次；重新验证后可用，旧代次任务不能继续发送。
      requestBody: *connectionMutation
      responses:
        '200': *connectionResponse
  /api/v1/connections/{id}/revoke:
    parameters: *connectionPath
    post:
      operationId: revokeConnection
      description: 撤销连接并删除加密秘密，保留元信息与审计；已发送未知用量不自动退款。
      requestBody: *connectionMutation
      responses:
        '200': *connectionResponse
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: 服务进程可响应；不表示沙箱可运行。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: 初始化状态和规划中的课程模板。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401': &id001
          description: 未登录或密码不正确。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403': &id002
          description: 角色或资源权限不足。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/v1/sessions:
    post:
      operationId: startSession
      description: 初始化阶段始终拒绝启动，不会在宿主执行命令。
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '401': *id001
        '403': *id002
  /api/v1/catalog/summary:
    get:
      operationId: getCatalogSummary
      responses:
        '200':
          description: 真实资料数量。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSummary'
        '503':
          description: 管理数据库未连接。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401': *id001
        '403': *id002
  /api/v1/problems:
    get:
      operationId: listProblemRecords
      parameters: &id014
        - name: q
          in: query
          schema:
            type: string
            maxLength: 300
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - active
              - archived
        - name: difficulty
          in: query
          schema:
            type: string
            enum:
              - easy
              - medium
              - hard
        - name: classId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分页结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400': &id003
          description: 请求参数错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404': &id004
          description: 记录不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409': &id005
          description: 版本冲突、幂等键冲突或记录仍被引用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '415': &id006
          description: 需要 JSON 和产品请求标识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422': &id007
          description: 字段或关联校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '428': &id008
          description: 缺少记录版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500': &id009
          description: 操作未完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503': &id010
          description: 数据库不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401': *id001
        '403': *id002
    post:
      operationId: createProblemRecord
      parameters:
        - &id011
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,80}$
        - &id012
          name: X-AgentLab-Request
          in: header
          required: true
          schema:
            type: string
            enum:
              - catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogInput'
      responses:
        '201':
          description: 已保存的记录，ETag 为当前版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '422': *id007
        '428': *id008
        '500': *id009
        '503': *id010
        '401': *id001
        '403': *id002
