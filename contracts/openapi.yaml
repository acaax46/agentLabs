components:
  responses:
    Unavailable:
      description: 尚未配置经过验证的隔离运行环境。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
  schemas:
    Connection:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ownerId,
          name,
          provider,
          baseUrl,
          scope,
          models,
          status,
          generation,
          version,
          expiresAt,
          verifiedAt,
          message,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        provider:
          type: string
        baseUrl:
          type: string
        scope:
          type: string
          enum: [private, tenant]
        models:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, active, error, expired, revoked]
        generation:
          type: integer
        version:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [name, provider, baseUrl, scope, models, apiKey]
      properties:
        name:
          type: string
          maxLength: 80
        provider:
          type: string
          maxLength: 80
        baseUrl:
          type: string
        scope:
          type: string
          enum: [private, tenant]
        models:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
        apiKey:
          type: string
          writeOnly: true
          minLength: 4
          maxLength: 8192
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ConnectionMutation:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        apiKey:
          type: string
          writeOnly: true
          description: 仅更换密钥时填写。
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    RuntimeStatus:
      type: object
      additionalProperties: false
      required:
        - available
        - provider
        - reason
      properties:
        available:
          type: boolean
        provider:
          type: string
        reason:
          type: string
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - sessionExecution
        - grading
        - accountConnections
        - catalogManagement
        - recordQueries
      properties:
        sessionExecution:
          type: boolean
        grading:
          type: boolean
        accountConnections:
          type: boolean
        catalogManagement:
          type: boolean
        recordQueries:
          type: boolean
    Template:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - mode
        - status
        - agents
        - network
        - grading
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
            - classroom
            - competition
            - family
        status:
          type: string
          enum:
            - planned
        agents:
          type: array
          items:
            type: string
        network:
          type: string
        grading:
          type: string
    Bootstrap:
      type: object
      additionalProperties: false
      required:
        - product
        - version
        - mode
        - runtime
        - capabilities
        - templates
      properties:
        product:
          type: string
        version:
          type: string
        mode:
          type: string
          enum:
            - scaffold
        runtime:
          $ref: '#/components/schemas/RuntimeStatus'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    Sample:
      type: object
      additionalProperties: false
      required: []
      properties:
        input:
          type: string
          maxLength: 10000
        output:
          type: string
          maxLength: 10000
        explanation:
          type: string
          maxLength: 2000
    ProblemFields:
      type: object
      additionalProperties: false
      required:
        - difficulty
        - timeLimitMs
        - memoryLimitMb
      properties:
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        language:
          type: string
          enum:
            - python
            - html
        statement:
          type: string
          maxLength: 30000
        inputDescription:
          type: string
          maxLength: 10000
        outputDescription:
          type: string
          maxLength: 10000
        timeLimitMs:
          type: integer
          minimum: 100
          maximum: 60000
